<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560">
  <defs>
    <filter id="s"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#ff00aa" stroke-width="2.5" opacity="0.5"/>
    </pattern>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#00ffcc" stroke-width="0.6" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- glow blobs behind -->
  <ellipse cx="200" cy="270" rx="180" ry="210" fill="#ff0088" opacity="0.12" filter="url(#s)"/>
  <circle cx="360" cy="270" r="155" fill="#1122dd" opacity="0.15" filter="url(#s)"/>

  <!-- large magenta thick-stroked irregular shape (left) -->
  <path d="M 60,90 L 230,50 L 295,155 L 260,320 L 95,340 L 30,215 Z"
        fill="#ff0088" opacity="0.78"/>
  <!-- hatching overlay on the shape -->
  <path d="M 60,90 L 230,50 L 295,155 L 260,320 L 95,340 L 30,215 Z"
        fill="url(#hatch)" opacity="0.35"/>
  <!-- highlight edge on left shape -->
  <path d="M 60,90 L 230,50 L 295,155" fill="none" stroke="#ff88cc" stroke-width="3" opacity="0.55"/>

  <!-- large blue circle (right) -->
  <circle cx="365" cy="268" r="158" fill="#1133dd" opacity="0.72"/>
  <!-- circle inner highlight -->
  <circle cx="340" cy="240" r="80" fill="#2255ff" opacity="0.25"/>
  <!-- grid overlay on blue circle -->
  <circle cx="365" cy="268" r="158" fill="url(#grid)" opacity="0.6"/>

  <!-- thick pipe shape (center-top) -->
  <path d="M 120,40 L 320,40 L 380,100 L 320,100 L 320,160 L 120,160 Z"
        fill="#9900ff" opacity="0.55"/>
  <path d="M 120,40 L 320,40 L 380,100" fill="none" stroke="#cc88ff" stroke-width="3" opacity="0.6"/>

  <!-- concentric rings overlay -->
  <g fill="none" stroke="#00ffcc" opacity="0.42">
    <circle cx="280" cy="280" r="200" stroke-width="1.5"/>
    <circle cx="280" cy="280" r="150" stroke-width="1"/>
    <circle cx="280" cy="280" r="88"  stroke-width="1.2"/>
  </g>

  <!-- yellow glitch bars -->
  <g opacity="1">
    <rect x="0" y="180" width="560" height="7" fill="#ffdd00" opacity="0.62"/>
    <rect x="0" y="204" width="560" height="3" fill="#ffee44" opacity="0.38"/>
    <rect x="0" y="312" width="560" height="5" fill="#ffdd00" opacity="0.52"/>
    <rect x="0" y="344" width="560" height="2" fill="#ffee44" opacity="0.28"/>
    <rect x="0" y="420" width="560" height="4" fill="#ffdd00" opacity="0.40"/>
  </g>

  <!-- cyan arrow/chevron bottom-left -->
  <path d="M 20,420 L 110,340 L 155,340 L 65,420 Z" fill="#00ffcc" opacity="0.58"/>
  <path d="M 80,460 L 155,390 L 185,390 L 110,460 Z" fill="#00ffcc" opacity="0.38"/>

  <!-- magenta thick outline rectangle -->
  <rect x="50" y="60" width="310" height="240" fill="none" stroke="#ff00ff" stroke-width="11" opacity="0.30"/>

  <!-- top-right circle cluster -->
  <circle cx="460" cy="80" r="52" fill="none" stroke="#00ccff" stroke-width="2" opacity="0.50"/>
  <circle cx="480" cy="68" r="28" fill="#00ccff" opacity="0.18"/>
  <circle cx="444" cy="96" r="16" fill="#ff0088" opacity="0.42"/>
  <circle cx="464" cy="78" r="5"  fill="#00ccff"/>

  <!-- small white circuit lines -->
  <g fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.22">
    <path d="M 0,148 L 60,148 L 60,200 L 110,200"/>
    <path d="M 460,380 L 460,440 L 520,440"/>
    <path d="M 310,520 L 310,480 L 380,480 L 380,440"/>
  </g>

  <!-- diagonal stripe zone top-right corner -->
  <path d="M 400,0 L 560,0 L 560,180 Z" fill="#ff66ff" opacity="0.10"/>

  <!-- small squares scattered -->
  <rect x="22" y="356" width="18" height="18" fill="#ff0088" opacity="0.50"/>
  <rect x="510" y="140" width="14" height="14" fill="#00ccff" opacity="0.45" transform="rotate(20 517 147)"/>
  <rect x="480" y="460" width="22" height="22" fill="#ffdd00" opacity="0.38" transform="rotate(-15 491 471)"/>
</svg>
