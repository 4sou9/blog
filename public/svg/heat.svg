<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 580">
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="diag" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-55)">
      <line x1="0" y1="0" x2="0" y2="14" stroke="#ff4400" stroke-width="1.5" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- diagonal stripe field (background) -->
  <rect width="440" height="580" fill="url(#diag)" opacity="0.45"/>

  <!-- horizontal lines (many, varied width) -->
  <g stroke="#ff6622" fill="none">
    <line x1="0" y1="62"  x2="440" y2="62"  stroke-width="0.8" opacity="0.30"/>
    <line x1="0" y1="108" x2="440" y2="108" stroke-width="1.4" opacity="0.40"/>
    <line x1="0" y1="154" x2="440" y2="154" stroke-width="0.6" opacity="0.25"/>
    <line x1="0" y1="200" x2="440" y2="200" stroke-width="2.0" opacity="0.50"/>
    <line x1="0" y1="246" x2="440" y2="246" stroke-width="0.8" opacity="0.30"/>
    <line x1="0" y1="292" x2="440" y2="292" stroke-width="1.2" opacity="0.38"/>
    <line x1="0" y1="338" x2="440" y2="338" stroke-width="0.6" opacity="0.22"/>
    <line x1="0" y1="384" x2="440" y2="384" stroke-width="1.8" opacity="0.45"/>
    <line x1="0" y1="430" x2="440" y2="430" stroke-width="0.8" opacity="0.28"/>
    <line x1="0" y1="476" x2="440" y2="476" stroke-width="1.0" opacity="0.35"/>
    <line x1="0" y1="522" x2="440" y2="522" stroke-width="0.6" opacity="0.22"/>
  </g>

  <!-- large red circle (main element, left-center) -->
  <circle cx="190" cy="310" r="152" fill="#cc1100" opacity="0.88" filter="url(#g)"/>
  <!-- circle highlight crescent -->
  <circle cx="155" cy="270" r="100" fill="#ee3311" opacity="0.30"/>
  <!-- circle stroke -->
  <circle cx="190" cy="310" r="152" fill="none" stroke="#ff3300" stroke-width="2.5" opacity="0.60"/>
  <!-- concentric inner -->
  <circle cx="190" cy="310" r="90"  fill="none" stroke="#ff5533" stroke-width="1.2" opacity="0.38"/>
  <circle cx="190" cy="310" r="38"  fill="none" stroke="#ff6644" stroke-width="1.0" opacity="0.30"/>

  <!-- orange triangle (right-upper area) -->
  <polygon points="308,60 420,310 196,310" fill="#ff6600" opacity="0.72"/>
  <!-- triangle highlight edge -->
  <path d="M 308,60 L 420,310" stroke="#ff9944" stroke-width="3" opacity="0.55" fill="none"/>
  <!-- triangle inner stripe -->
  <path d="M 330,120 L 405,290 L 255,290 Z" fill="#ff8800" opacity="0.22"/>

  <!-- small circle top-right nav indicator -->
  <circle cx="390" cy="68" r="32" fill="none" stroke="#ff8844" stroke-width="2.5" opacity="0.60"/>
  <circle cx="390" cy="68" r="18" fill="none" stroke="#ff8844" stroke-width="1"   opacity="0.40"/>
  <circle cx="390" cy="68" r="5"  fill="#ff8844" opacity="0.70"/>

  <!-- thin accent lines (left side) -->
  <g stroke="#ff4422" fill="none" opacity="0.40">
    <line x1="0"   y1="200" x2="38"  y2="200" stroke-width="1.5"/>
    <line x1="38"  y1="200" x2="38"  y2="240" stroke-width="1.5"/>
    <line x1="0"   y1="310" x2="22"  y2="310" stroke-width="2.5"/>
    <line x1="0"   y1="380" x2="50"  y2="380" stroke-width="1"/>
    <line x1="50"  y1="380" x2="50"  y2="420" stroke-width="1"/>
  </g>

  <!-- small square accents -->
  <rect x="14"  y="520" width="20" height="20" fill="#ff6600" opacity="0.55"/>
  <rect x="400" y="520" width="20" height="20" fill="none" stroke="#ff6600" stroke-width="2" opacity="0.45"/>
  <rect x="20"  y="28"  width="14" height="14" fill="none" stroke="#ff8844" stroke-width="1.5" opacity="0.38"/>
</svg>
