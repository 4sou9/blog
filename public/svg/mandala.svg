<svg xmlns="http://www.w3.org/2000/svg" viewBox="-260 -260 520 520">
  <defs>
    <filter id="g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#1e8040" stroke-linecap="butt">

    <!-- outer rings -->
    <circle cx="0" cy="0" r="248" stroke-width="0.7" opacity="0.30"/>
    <circle cx="0" cy="0" r="230" stroke-width="1.2" opacity="0.38" stroke-dasharray="6 5"/>
    <circle cx="0" cy="0" r="210" stroke-width="0.8" opacity="0.28"/>
    <circle cx="0" cy="0" r="192" stroke-width="1.8" opacity="0.45"/>
    <circle cx="0" cy="0" r="168" stroke-width="0.7" opacity="0.28" stroke-dasharray="3 6"/>
    <circle cx="0" cy="0" r="148" stroke-width="1.4" opacity="0.48"/>
    <circle cx="0" cy="0" r="122" stroke-width="0.8" opacity="0.32"/>
    <circle cx="0" cy="0" r="100" stroke-width="2.0" opacity="0.55" filter="url(#g)"/>
    <circle cx="0" cy="0" r="76"  stroke-width="0.8" opacity="0.38"/>
    <circle cx="0" cy="0" r="55"  stroke-width="1.6" opacity="0.60"/>
    <circle cx="0" cy="0" r="34"  stroke-width="1.0" opacity="0.50"/>
    <circle cx="0" cy="0" r="16"  stroke-width="2.5" opacity="0.70"/>

    <!-- main cross -->
    <line x1="0" y1="-255" x2="0" y2="255"   stroke-width="0.9" opacity="0.42"/>
    <line x1="-255" y1="0" x2="255" y2="0"   stroke-width="0.9" opacity="0.42"/>

    <!-- diagonal cross -->
    <line x1="-180" y1="-180" x2="180" y2="180" stroke-width="0.7" opacity="0.30"/>
    <line x1="180"  y1="-180" x2="-180" y2="180" stroke-width="0.7" opacity="0.30"/>

    <!-- inner diamond -->
    <polygon points="0,-66 66,0 0,66 -66,0" stroke-width="1.5" opacity="0.58"/>

    <!-- outer diamond -->
    <polygon points="0,-148 148,0 0,148 -148,0" stroke-width="1.2" opacity="0.42"/>

    <!-- 8-point star inner -->
    <path d="M 0,-55 L 14,-14 L 55,0 L 14,14 L 0,55 L -14,14 L -55,0 L -14,-14 Z"
          stroke-width="1.2" opacity="0.45"/>

    <!-- compass arrows (N/S/E/W) -->
    <path d="M 0,-248 L -8,-228 L 0,-235 L 8,-228 Z" stroke-width="1" opacity="0.60"/>
    <path d="M 0,248  L -8,228  L 0,235  L 8,228  Z" stroke-width="1" opacity="0.45"/>
    <path d="M -248,0 L -228,-8 L -235,0 L -228,8 Z" stroke-width="1" opacity="0.45"/>
    <path d="M 248,0  L 228,-8  L 235,0  L 228,8  Z" stroke-width="1" opacity="0.45"/>

    <!-- tick marks on r192 (every 10°) -->
    <g opacity="0.38" stroke-width="1.0">
      <line x1="0"    y1="-200" x2="0"    y2="-184"/>
      <line x1="66"   y1="-187" x2="63"   y2="-175"/>
      <line x1="124"  y1="-155" x2="118"  y2="-144"/>
      <line x1="166"  y1="-108" x2="159"  y2="-100"/>
      <line x1="192"  y1="-49"  x2="183"  y2="-46"/>
      <line x1="192"  y1="49"   x2="183"  y2="46"/>
      <line x1="166"  y1="108"  x2="159"  y2="100"/>
      <line x1="124"  y1="155"  x2="118"  y2="144"/>
      <line x1="66"   y1="187"  x2="63"   y2="175"/>
      <line x1="0"    y1="200"  x2="0"    y2="184"/>
      <line x1="-66"  y1="187"  x2="-63"  y2="175"/>
      <line x1="-124" y1="155"  x2="-118" y2="144"/>
      <line x1="-166" y1="108"  x2="-159" y2="100"/>
      <line x1="-192" y1="49"   x2="-183" y2="46"/>
      <line x1="-192" y1="-49"  x2="-183" y2="-46"/>
      <line x1="-166" y1="-108" x2="-159" y2="-100"/>
      <line x1="-124" y1="-155" x2="-118" y2="-144"/>
      <line x1="-66"  y1="-187" x2="-63"  y2="-175"/>
    </g>
  </g>

  <!-- center dot -->
  <circle cx="0" cy="0" r="5" fill="#1e8040" opacity="0.9" filter="url(#g)"/>
  <circle cx="0" cy="0" r="9" fill="none" stroke="#1e8040" stroke-width="1.5" opacity="0.6"/>

  <!-- text annotations -->
  <g font-family="monospace" fill="#1e8040" font-size="9" opacity="0.55" letter-spacing="1">
    <text x="6"   y="-220" text-anchor="start">N</text>
    <text x="6"   y="232"  text-anchor="start">S</text>
    <text x="216" y="4"    text-anchor="start">E</text>
    <text x="-228" y="4"   text-anchor="end">W</text>
    <text x="155" y="-158" font-size="7" opacity="0.40">33°52'N</text>
    <text x="-200" y="175" font-size="7" opacity="0.35">151°12'E</text>
  </g>
</svg>
