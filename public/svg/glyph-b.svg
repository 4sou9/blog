<svg xmlns="http://www.w3.org/2000/svg" viewBox="-110 -110 220 220">
  <!-- abstract SF symbol - different from glyph-a -->
  <defs>
    <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- outer hexagonal frame -->
  <polygon points="0,-100 86,-50 86,50 0,100 -86,50 -86,-50"
           fill="none" stroke="#cc1133" stroke-width="1.5" opacity="0.28"/>

  <!-- inner rotated square -->
  <rect x="-56" y="-56" width="112" height="112" fill="none"
        stroke="#cc1133" stroke-width="2" opacity="0.38" transform="rotate(45)"/>

  <!-- center bold shape: angular zig-zag -->
  <path d="M -70,-40 L -20,-40 L 0,-70 L 20,-40 L 70,-40
           L 70,40 L 20,40 L 0,70 L -20,40 L -70,40 Z"
        fill="none" stroke="#cc1133" stroke-width="6" stroke-linejoin="round" opacity="0.75"/>

  <!-- inner version thinner -->
  <path d="M -45,-25 L -12,-25 L 0,-45 L 12,-25 L 45,-25
           L 45,25 L 12,25 L 0,45 L -12,25 L -45,25 Z"
        fill="none" stroke="#cc1133" stroke-width="2" opacity="0.40"/>

  <!-- center dot with glow -->
  <circle cx="0" cy="0" r="8"  fill="#cc1133" opacity="0.85" filter="url(#g)"/>
  <circle cx="0" cy="0" r="14" fill="none" stroke="#cc1133" stroke-width="1.5" opacity="0.45"/>

  <!-- diagonal accent lines -->
  <g stroke="#cc1133" fill="none" opacity="0.32" stroke-width="1">
    <line x1="-110" y1="-70" x2="-86" y2="-50"/>
    <line x1="86" y1="50" x2="110" y2="70"/>
    <line x1="-110" y1="70" x2="-86" y2="50"/>
    <line x1="86" y1="-50" x2="110" y2="-70"/>
  </g>

  <!-- four corner dots -->
  <g fill="#cc1133" opacity="0.65">
    <circle cx="0"   cy="-100" r="5"/>
    <circle cx="86"  cy="-50"  r="4"/>
    <circle cx="86"  cy="50"   r="4"/>
    <circle cx="0"   cy="100"  r="5"/>
    <circle cx="-86" cy="50"   r="4"/>
    <circle cx="-86" cy="-50"  r="4"/>
  </g>

  <!-- small triangle details -->
  <polygon points="-8,-72 0,-85 8,-72" fill="#cc1133" opacity="0.50"/>
  <polygon points="-8,72 0,85 8,72"   fill="#cc1133" opacity="0.50"/>
</svg>
