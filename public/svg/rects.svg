<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <!-- floating white/gray rectangles at various angles -->
  <!-- rect A - large, upper-left area, slight tilt -->
  <rect x="60" y="40" width="220" height="280" fill="#c8ccd8" opacity="0.62" transform="rotate(5 170 180)"/>
  <rect x="60" y="40" width="220" height="280" fill="none" stroke="#e0e2ec" stroke-width="1.5" opacity="0.40" transform="rotate(5 170 180)"/>

  <!-- rect B - medium, upper right, different tilt -->
  <rect x="530" y="28" width="140" height="195" fill="#b0b4c8" opacity="0.52" transform="rotate(-4 600 125)"/>
  <rect x="530" y="28" width="140" height="195" fill="none" stroke="#d0d3e4" stroke-width="1" opacity="0.35" transform="rotate(-4 600 125)"/>

  <!-- rect C - wide, center-right, larger -->
  <rect x="420" y="210" width="280" height="168" fill="#bfc3d5" opacity="0.60" transform="rotate(3 560 294)"/>
  <rect x="420" y="210" width="280" height="168" fill="none" stroke="#d8daeb" stroke-width="1.5" opacity="0.38" transform="rotate(3 560 294)"/>

  <!-- rect D - narrow tall, left-lower -->
  <rect x="30" y="330" width="175" height="220" fill="#a8acbe" opacity="0.48" transform="rotate(-7 117 440)"/>
  <rect x="30" y="330" width="175" height="220" fill="none" stroke="#c8cad8" stroke-width="1" opacity="0.32" transform="rotate(-7 117 440)"/>

  <!-- rect E - small, lower right -->
  <rect x="600" y="390" width="160" height="105" fill="#c0c4d4" opacity="0.55" transform="rotate(6 680 442)"/>

  <!-- subtle inner lines on rect A -->
  <g transform="rotate(5 170 180)" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.18">
    <line x1="60" y1="110" x2="280" y2="110"/>
    <line x1="60" y1="200" x2="280" y2="200"/>
    <line x1="140" y1="40" x2="140" y2="320"/>
  </g>

  <!-- tiny accent dots at rect corners -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="66"  cy="45"  r="3" transform="rotate(5 170 180)"/>
    <circle cx="276" cy="45"  r="3" transform="rotate(5 170 180)"/>
    <circle cx="66"  cy="315" r="3" transform="rotate(5 170 180)"/>
  </g>

  <!-- very faint grid overlay on entire canvas -->
  <g stroke="#b8bcd0" stroke-width="0.4" opacity="0.12">
    <line x1="0"   y1="140" x2="800" y2="140"/>
    <line x1="0"   y1="280" x2="800" y2="280"/>
    <line x1="0"   y1="420" x2="800" y2="420"/>
    <line x1="200" y1="0"   x2="200" y2="560"/>
    <line x1="400" y1="0"   x2="400" y2="560"/>
    <line x1="600" y1="0"   x2="600" y2="560"/>
  </g>
</svg>
