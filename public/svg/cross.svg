<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -120 240 240">
  <defs>
    <filter id="neon">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="0.9" fill="#ff00aa" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- outer rings -->
  <circle cx="0" cy="0" r="112" fill="none" stroke="#ff00aa" stroke-width="0.7" opacity="0.22" stroke-dasharray="4 6"/>
  <circle cx="0" cy="0" r="96"  fill="none" stroke="#ff00aa" stroke-width="1"   opacity="0.30"/>
  <circle cx="0" cy="0" r="42"  fill="none" stroke="#ff00aa" stroke-width="1.2" opacity="0.40"/>

  <!-- main X shape - thick outer -->
  <path d="M -85,-85 L 85,85 M 85,-85 L -85,85"
        stroke="#ff0088" stroke-width="22" stroke-linecap="square" fill="none" opacity="0.70"/>
  <!-- X inner highlight -->
  <path d="M -85,-85 L 85,85 M 85,-85 L -85,85"
        stroke="#ff88cc" stroke-width="5" stroke-linecap="square" fill="none" opacity="0.50" filter="url(#neon)"/>
  <!-- X thin bright center line -->
  <path d="M -85,-85 L 85,85 M 85,-85 L -85,85"
        stroke="#ffffff" stroke-width="1.5" stroke-linecap="square" fill="none" opacity="0.40"/>

  <!-- endpoint corner blocks -->
  <g fill="#ff0088">
    <rect x="-96" y="-96" width="18" height="18"/>
    <rect x="78"  y="-96" width="18" height="18"/>
    <rect x="-96" y="78"  width="18" height="18"/>
    <rect x="78"  y="78"  width="18" height="18"/>
  </g>

  <!-- center circle -->
  <circle cx="0" cy="0" r="16" fill="#ff0088" opacity="0.80" filter="url(#neon)"/>
  <circle cx="0" cy="0" r="22" fill="none" stroke="#ff88cc" stroke-width="1.5" opacity="0.60"/>

  <!-- circuit extensions from corners -->
  <g fill="none" stroke="#ff00aa" stroke-width="1" opacity="0.32">
    <path d="M -96,-96 L -120,-96 L -120,-70"/>
    <path d="M  96,-96 L  120,-96 L  120,-70"/>
    <path d="M -96, 96 L -120, 96 L -120, 70"/>
    <path d="M  96, 96 L  120, 96 L  120, 70"/>
  </g>

  <!-- small dot pattern fill in one quadrant -->
  <path d="M 0,-96 L 96,-96 L 96,0 L 0,0 Z" fill="url(#dots)" opacity="0.6"/>
</svg>
