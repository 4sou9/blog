<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -100 200 200">
  <defs>
    <filter id="g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="0" cy="0" r="90" fill="none" stroke="#cc1133" stroke-width="0.8" opacity="0.25" stroke-dasharray="3 5"/>
  <circle cx="0" cy="0" r="72" fill="none" stroke="#cc1133" stroke-width="1.2" opacity="0.35"/>
  <circle cx="0" cy="0" r="52" fill="none" stroke="#cc1133" stroke-width="0.8" opacity="0.28" stroke-dasharray="4 3"/>
  <circle cx="0" cy="0" r="34" fill="none" stroke="#cc1133" stroke-width="2" opacity="0.50"/>
  <circle cx="0" cy="0" r="16" fill="none" stroke="#cc1133" stroke-width="2.5" opacity="0.65"/>
  <circle cx="0" cy="0" r="5" fill="#cc1133" opacity="0.8"/>
  <!-- tick marks on r72 -->
  <g stroke="#cc1133" stroke-width="1.5" opacity="0.5">
    <line x1="0" y1="-80" x2="0" y2="-64"/>
    <line x1="0" y1="64" x2="0" y2="80"/>
    <line x1="-80" y1="0" x2="-64" y2="0"/>
    <line x1="64" y1="0" x2="80" y2="0"/>
  </g>
  <!-- diagonal ticks -->
  <g stroke="#cc1133" stroke-width="1" opacity="0.30">
    <line x1="51" y1="-51" x2="43" y2="-43"/>
    <line x1="-51" y1="-51" x2="-43" y2="-43"/>
    <line x1="51" y1="51" x2="43" y2="43"/>
    <line x1="-51" y1="51" x2="-43" y2="43"/>
  </g>
  <!-- satellite dot on orbit -->
  <circle cx="72" cy="0" r="5" fill="#cc1133" filter="url(#g)"/>
  <circle cx="-52" cy="0" r="3.5" fill="none" stroke="#cc1133" stroke-width="1.5" opacity="0.6"/>
  <!-- small indicator cross -->
  <path d="M -8,0 L 8,0 M 0,-8 L 0,8" stroke="#cc1133" stroke-width="1" opacity="0.4" fill="none"/>
</svg>
